<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>IURD SPLIT SCREEN DVE OVERLAY</title>
    <script type="text/javascript" src="js/lib/anime.min.js"></script>
    <script type="text/javascript" src="js/spx_interface.js"></script>
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" type="text/css" id="DynamicTheme" href="themes/Default.css" />
    <style>
        .SPXWindow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #gfx {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0; /* animated */
        }

        /* Frame border style */
        .split-frame {
            position: absolute;
            width: 44vw;
            height: 58vh;
            top: 18vh;
            box-sizing: border-box;
            border: 0.35vw solid var(--theme-brandColor, #cc0909);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 0.4vw;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        #leftFrame {
            left: 4vw;
            transform-origin: center left;
        }

        #rightFrame {
            right: 4vw;
            transform-origin: center right;
        }

        /* Metallic labels underneath frames */
        .frame-label-box {
            position: absolute;
            top: 77.2vh;
            height: 4.8vh;
            padding: 0.1vw 2vw;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 16vw;
            
            /* Slanted parallel cut */
            clip-path: polygon(1.5vw 0%, 100% 0%, calc(100% - 1.5vw) 100%, 0% 100%);
            
            background: var(--theme-iurd-bottom-bg, linear-gradient(to bottom, #ffffff 0%, #f4f5f7 50%, #e1e3e8 100%));
            color: var(--theme-iurd-bottom-text-color, #1c0505);
            border-left: var(--theme-accent-width, 0.4vw) solid var(--theme-brandColor, #cc0909);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
            opacity: 0;
        }

        #leftLabel {
            left: 5vw;
        }

        #rightLabel {
            right: 5vw;
        }

        .label-content {
            display: flex;
            align-items: center;
            flex-direction: row;
        }

        .live-dot {
            width: 0.75vw;
            height: 0.75vw;
            background: #ff0505;
            border-radius: 50%;
            margin-right: 0.6vw;
            display: inline-block;
            box-shadow: 0 0 8px #ff0505;
            animation: blinkPulse 1.2s infinite ease-in-out;
        }

        @keyframes blinkPulse {
            0% { opacity: 0.35; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0.35; transform: scale(0.85); }
        }

        .label-title {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 1.3vw;
            font-weight: 900;
            letter-spacing: -0.01em;
            line-height: 1;
        }

        .label-subtitle {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 1.0vw;
            font-weight: 700;
            opacity: 0.8;
            letter-spacing: 0.04em;
            margin-left: 0.8vw;
            padding-left: 0.8vw;
            border-left: 0.1vw solid rgba(0, 0, 0, 0.2);
            line-height: 1;
        }
    </style>

    <script>
        function runTemplateUpdate() {
            // Apply visual theme from dropdown
            e('DynamicTheme').href = e('f99').innerText;

            // Load left title and subtitle
            e('leftTitleText').innerHTML = htmlDecode(e('f0').innerText);
            e('leftSubText').innerHTML = htmlDecode(e('f1').innerText);

            // Load right title and subtitle
            e('rightTitleText').innerHTML = htmlDecode(e('f2').innerText);
            e('rightSubText').innerHTML = htmlDecode(e('f3').innerText);

            // Handle live indicator dot status
            let showDot = e('f4').innerText.trim() === 'show';
            let dots = document.querySelectorAll('.live-dot');
            dots.forEach(dot => {
                dot.style.display = showDot ? 'inline-block' : 'none';
            });

            // Handle empty subtitle dividers
            toggleSubtitleDivider('leftSubText', 'leftSubDivider');
            toggleSubtitleDivider('rightSubText', 'rightSubDivider');

            setTimeout(runAnimationIN, 50);
        }

        function toggleSubtitleDivider(textId, dividerId) {
            let text = e(textId).innerText.trim();
            if (text === '') {
                e(textId).style.display = 'none';
            } else {
                e(textId).style.display = 'inline-block';
            }
        }

        function runAnimationIN() {
            var timelineIn = anime.timeline({
                easing: 'easeOutCubic',
                duration: 600
            });

            timelineIn
            .add({
                targets: ['#gfx'],
                opacity: [0, 1],
                duration: 50,
                easing: 'linear'
            }, 0)
            .add({
                targets: ['#leftFrame', '#rightFrame'],
                opacity: [0, 1],
                scale: [0.96, 1],
                duration: 500,
                delay: anime.stagger(100)
            }, 50)
            .add({
                targets: ['#leftLabel', '#rightLabel'],
                opacity: [0, 1],
                translateY: ['30%', '0%'],
                duration: 400,
                delay: anime.stagger(100)
            }, 250);
        }

        function runAnimationOUT() {
            var timelineOut = anime.timeline({
                easing: 'easeInCubic',
                duration: 450
            });

            timelineOut
            .add({
                targets: ['#leftLabel', '#rightLabel'],
                opacity: [1, 0],
                translateY: ['0%', '30%'],
                duration: 200,
                delay: anime.stagger(50)
            }, 0)
            .add({
                targets: ['#leftFrame', '#rightFrame'],
                opacity: [1, 0],
                scale: [1, 0.96],
                duration: 300,
                delay: anime.stagger(50)
            }, 80)
            .add({
                targets: ['#gfx'],
                opacity: 0,
                duration: 50,
                easing: 'linear'
            }, 380);
        }
    </script>
</head>
<body>
    <div class="SPXWindow">
        <div id="gfx">
            <!-- Two Split Frame Overlays -->
            <div class="split-frame" id="leftFrame"></div>
            <div class="split-frame" id="rightFrame"></div>

            <!-- Labels Underneath -->
            <div class="frame-label-box" id="leftLabel">
                <div class="label-content">
                    <span class="live-dot"></span>
                    <span class="label-title" id="leftTitleText"></span>
                    <span class="label-subtitle" id="leftSubText"></span>
                </div>
            </div>

            <div class="frame-label-box" id="rightLabel">
                <div class="label-content">
                    <span class="live-dot"></span>
                    <span class="label-title" id="rightTitleText"></span>
                    <span class="label-subtitle" id="rightSubText"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden elements for SPX interface parameters -->
    <div id="hiddenSpxData" style="display:none;">
        <div id="f0"></div>
        <div id="f1"></div>
        <div id="f2"></div>
        <div id="f3"></div>
        <div id="f4"></div>
        <div id="f99"></div>
    </div>
</body>
</html>
